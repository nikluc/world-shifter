<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>World Shifter — demo</title>
<style>
  html,body{overscroll-behavior:none;margin:0;height:100%;background:#07070d;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8e8f0;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;pointer-events:none;font-size:15px}
  #hud .info{text-align:center;line-height:1.3;text-shadow:0 1px 3px #000}
  #hud .info b{font-size:16px}
  #hud .btns{display:flex;gap:6px}
  #hud button{pointer-events:auto}
  @media (max-width:440px){ #hud{padding-left:8px;padding-right:8px;font-size:12px} #hud .btns{gap:4px} #hud button{padding:6px 8px;font-size:13px} #hud .info b{font-size:13px} }
  button{background:#1b1b2e;color:#e8e8f0;border:1px solid #3a3a5c;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;font-family:inherit}
  button:active{transform:scale(.96)}
  button.primary{background:#2d6b4a;border-color:#4fd18b}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,12,.8);z-index:5}
  .overlay.show{display:flex}
  .panel{background:#11111e;border:1px solid #2c2c48;border-radius:16px;padding:22px;max-width:420px;width:86%;text-align:center}
  .panel h1{margin:0 0 4px;font-size:26px;letter-spacing:1px}
  .panel h2{margin:0 0 8px;font-size:22px}
  .panel p{opacity:.8;margin:6px 0}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
  .grid button{padding:9px 0;font-size:17px;line-height:1.2}
  .chap{grid-column:1/-1;text-align:left;font-size:12px;opacity:.6;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
  .panel{max-height:88vh;overflow-y:auto}
  .grid small{display:block;font-size:12px;color:#ffd34d;min-height:14px}
  .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .stars{font-size:34px;letter-spacing:6px;color:#ffd34d;margin:6px 0}
  .panel.wide{max-width:680px}
  .panel{touch-action:pan-y}
  .tbl{overflow-x:auto;touch-action:pan-x pan-y}
  .tbl table{border-collapse:collapse;width:100%;font-size:12px}
  .tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid #2c2c48;text-align:right;white-space:nowrap}
  .tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
  .tbl tr.hot td{color:#ff8da1}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;text-align:center;opacity:.8;pointer-events:none;font-size:15px;padding:0 20px;text-shadow:0 1px 3px #000;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="btns"><button id="bMenu">☰</button><button id="bRestart">↻</button></div>
  <div class="info"><b id="lvlName"></b><br><span id="stats"></span></div>
  <div class="btns"><button id="bMusic">♫</button><button id="bSound">🔊</button><button id="bMode">Smooth</button></div>
</div>
<div id="hint"></div>

<div class="overlay show" id="menu">
  <div class="panel">
    <h1>WORLD SHIFTER</h1>
    <p>You don't move the ball. You turn the world.</p>
    <div class="grid" id="levelGrid"></div>
    <p style="font-size:13px">Drag or circle your finger to rotate · ← → / A D<br>Q / E snap 90° · R restart · M toggle mode<br>Tap / click / Space to drop the ball</p>
    <p style="font-size:11px;opacity:.45" id="ver">prototype v0.8 · 60 levels</p>
  </div>
</div>

<div class="overlay" id="statsPanel">
  <div class="panel wide">
    <h2>Playtest stats</h2>
    <p id="statsSummary" style="font-size:13px"></p>
    <div class="tbl"><table id="statsTable"></table></div>
    <label style="font-size:13px;display:block;margin-top:10px"><input type="checkbox" id="chkDeaths"> Show death spots (✕) inside levels</label>
    <div class="row"><button id="bCopyStats" class="primary">Copy</button><button id="bResetStats">Reset</button><button id="bCloseStats">Close</button></div>
    <textarea id="statsText" readonly style="display:none;width:100%;height:90px;margin-top:10px;font-size:11px;background:#07070d;color:#e8e8f0;border:1px solid #2c2c48"></textarea>
  </div>
</div>

<div class="overlay" id="win">
  <div class="panel">
    <h2>Landed!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winInfo"></p>
    <div class="row"><button id="bRetry">↻ Retry</button><button id="bNext" class="primary">Next ▶</button></div>
  </div>
</div>

<script>
"use strict";
// ---------- Tuning ----------
const G = 950;            // gravity, world units / s^2
const MAX_SPEED = 1100;
const BALL_R = 14;
const ROT_SPEED = 2.6;    // rad/s for keyboard rotation
const DRAG_RAD_PER_PX = 0.0065; // straight drags near the centre of the screen
const DIAL_INNER = 50;   // px from screen centre: inside this, drag is plain left/right
const DIAL_BLEND = 90;   // px over which it blends into full "turn the dial" rotation
const SUBSTEPS = 5;
const START_FREEZE = 0.6; // seconds of "Ready…" before the player may drop the ball
const SFX_VOLUME = 0.5;   // master volume 0..1
const THUD_MIN_SPEED = 120; // impact speed below which wall hits are silent
const MUSIC_VOLUME = 0.6; // background music level, relative to the master volume
const MUSIC_BPM = 100;
const GUIDE_LEVELS = 5;   // dotted "where you'll fall" preview on the first N levels
const GUIDE_TIME = 1.2;   // seconds of predicted path
const GHOST_HZ = 30;      // best-run ghost samples per second
const GLUE_RELEASE = 0.5; // glue lets go once gravity pulls away from it at >= this fraction of G (~60° turn)
const HIT_FEEDBACK_SPEED = 350; // wall hits harder than this shake the screen + vibrate

// ---------- Levels ----------
// objs: rect centred at x,y with size w,h, rotated a degrees. t: wall | spike | goal | bounce | ice | glue | portal
//   ice: no grip, barely bounces · glue: holds the ball until gravity pulls it away (GLUE_RELEASE)
//   portal: needs link: "a" — touching one sends the ball to the centre of the other with the same velocity
//   m: [dx, dy, period]  → slides back and forth by ±dx/±dy every `period` seconds
//   spin: degrees per second → rotates around its centre
// cam: 'follow' (world rotates around the ball) or 'fixed' (rotates around the level centre)
// bounds: open levels only — leave this circle and the void takes you
// par: [3-star seconds, 2-star seconds]
const box = (hw, hh, t = "wall") => [
  { x: 0, y: hh + 12, w: 2 * hw + 48, h: 24, t },
  { x: 0, y: -hh - 12, w: 2 * hw + 48, h: 24, t },
  { x: -hw - 12, y: 0, w: 24, h: 2 * hh + 48, t },
  { x: hw + 12, y: 0, w: 24, h: 2 * hh + 48, t },
];

const LEVELS = [
  // ── Chapter 1: learn to turn ─────────────────────────────
  { name: "Steer the Fall", cam: "follow", view: 820, bounds: 650, start: [0, -250], par: [3, 6],
    hint: "Drag or draw circles (or ← →) to rotate the world. Miss the spikes, land on the green pad.",
    objs: [
      { x: 0, y: 200, w: 140, h: 24, t: "spike" },
      { x: 190, y: 200, w: 160, h: 24, t: "goal" },
    ] },
  { name: "Over the Wall", cam: "fixed", view: 720, start: [-150, 234], par: [5, 10],
    hint: "Turn the whole box to roll the ball over the wall.",
    objs: [
      ...box(250, 250),
      { x: 0, y: 60, w: 24, h: 380, t: "wall" },

      { x: -110, y: -40, w: 200, h: 16, a: 35, t: "wall" },

      { x: 0, y: 220, w: 200, h: 24, t: "spike" },
      { x: -230, y: 200, w: 120, h: 20, t: "goal" },

  { name: "Spike Garden", cam: "follow", view: 860, bounds: 700, start: [0, -295], par: [5, 10],

      { x: 0, y: -270, w: 120, h: 20, t: "wall" },

      { x: 0, y: 260, w: 800, h: 24, t: "spike" },

      { x: 170, y: 170, w: 200, h: 24, t: "spike" },
      { x: 320, y: 0, w: 120, h: 20, t: "goal" },

  { name: "Corner Shot", cam: "fixed", view: 720, start: [-200, 226], par: [4, 8],

    objs: [
      ...box(240, 240),
      { x: 40, y: 230, w: 400, h: 20, t: "spike" },
      { x: -40, y: -230, w: 400, h: 20, t: "spike" },
      { x: 200, y: -230, w: 80, h: 20, t: "goal" },

  // ── Chapter 3: things that move ──────────────────────────
  { name: "Slider", cam: "fixed", view: 720, start: [0, -212], par: [5, 10],
    hint: "Hazards move now. Wait for your moment.",
    objs: [
      ...box(250, 250),
      { x: 0, y: -190, w: 100, h: 16, t: "wall" },
      { x: 0, y: 20, w: 100, h: 24, t: "spike", m: [170, 0, 2.6] },
      { x: -240, y: 130, w: 20, h: 200, t: "spike" },
      { x: 240, y: 130, w: 20, h: 200, t: "spike" },
      { x: 0, y: 240, w: 100, h: 20, t: "goal" },
    ] },
  { name: "Spinner", cam: "fixed", view: 820, bounds: 600, start: [-250, -244], par: [5, 10],
    hint: "Slip past the spinning blade.",
    objs: [
      { x: -250, y: -220, w: 120, h: 20, t: "wall" },
      { x: 0, y: 0, w: 280, h: 20, t: "spike", spin: 70 },
      { x: 250, y: 230, w: 120, h: 20, t: "goal" },
    ] },
  { name: "Crusher Corridor", cam: "fixed", view: 860, start: [-340, 66], par: [8, 16],
    hint: "Floor or ceiling? Flip to whichever side is open.",
    objs: [
      ...box(380, 80),
      { x: -170, y: 0, w: 24, h: 100, t: "spike", m: [0, 50, 2.2] },
      { x: 0, y: 0, w: 24, h: 100, t: "spike", m: [0, -50, 2.2] },
      { x: 170, y: 0, w: 24, h: 100, t: "spike", m: [0, 50, 1.6] },
      { x: 370, y: 0, w: 20, h: 120, t: "goal" },
    ] },
  { name: "Needle", cam: "follow", view: 860, bounds: 700, start: [0, -320], par: [4, 8],
    hint: "Thread the moving gap, then find the pad.",
    objs: [
      { x: -96, y: -60, w: 140, h: 24, t: "spike", m: [120, 0, 4] },
      { x: 96, y: -60, w: 140, h: 24, t: "spike", m: [120, 0, 4] },
      { x: 0, y: 300, w: 800, h: 24, t: "spike" },
      { x: 150, y: 250, w: 70, h: 20, t: "goal" },
    ] },
  { name: "Crossroads", cam: "fixed", view: 720, start: [-110, -26], par: [8, 16],
    hint: "Two ways round. Each one has a gatekeeper.",
    objs: [
      ...box(260, 260),
      { x: 0, y: 0, w: 300, h: 24, t: "wall" },
      { x: 0, y: 0, w: 24, h: 300, t: "wall" },
      { x: 0, y: -205, w: 24, h: 60, t: "spike", m: [0, 40, 2] },
      { x: -205, y: 0, w: 60, h: 24, t: "spike", m: [40, 0, 2] },
      { x: 200, y: 245, w: 80, h: 20, t: "goal" },
    ] },

  // ── Chapter 4: everything at once ────────────────────────
  { name: "Moving Target", cam: "follow", view: 860, bounds: 700, start: [0, -295], par: [5, 10],
    hint: "The pad won't wait for you.",
    objs: [
      { x: 0, y: -270, w: 120, h: 20, t: "wall" },
      { x: 0, y: -60, w: 100, h: 24, t: "spike", spin: 90 },
      { x: 0, y: 280, w: 800, h: 24, t: "spike" },
      { x: 0, y: 150, w: 90, h: 20, t: "goal", m: [220, 0, 3.2] },
    ] },
  { name: "Long Fall", cam: "follow", view: 900, bounds: 1150, start: [0, -900], par: [6, 12],
    hint: "A long way down. Keep weaving.",
    objs: [
      { x: -100, y: -600, w: 240, h: 24, t: "spike" },
      { x: 120, y: -300, w: 240, h: 24, t: "spike" },
      { x: -80, y: 0, w: 280, h: 24, t: "spike" },
      { x: 100, y: 300, w: 260, h: 24, t: "spike" },
      { x: 0, y: 600, w: 220, h: 24, t: "spike" },
      { x: 0, y: 900, w: 140, h: 20, t: "goal" },

  { name: "Corkscrew", cam: "fixed", view: 820, start: [-170, -204], par: [12, 24],
    hint: "Zigzag again — but the shelves have pop-up spikes. Roll across while they're down.",
    objs: [
      ...box(220, 340),
      { x: -50, y: -180, w: 340, h: 20, t: "wall" },
      { x: 50, y: 0, w: 340, h: 20, t: "wall" },
      { x: -50, y: 180, w: 340, h: 20, t: "wall" },
      // pop-up spikes: rise out of the shelf and sink back (down ≈ 1/3 of the cycle)
      { x: 40, y: -6, w: 40, h: 24, t: "spike", m: [0, 16, 2.2] },
      { x: -40, y: 174, w: 40, h: 24, t: "spike", m: [0, 16, 1.8] },
      { x: -170, y: 330, w: 80, h: 20, t: "goal" },
    ] },
  { name: "Twin Blades", cam: "fixed", view: 760, start: [0, -242], par: [5, 10],
    hint: "Two blades, one narrow path through the middle.",
    objs: [
      ...box(280, 280),
      { x: 0, y: -220, w: 100, h: 16, t: "wall" },
      { x: -120, y: 0, w: 180, h: 18, t: "spike", spin: 80 },
      { x: 120, y: 0, w: 180, h: 18, t: "spike", spin: -80 },
      { x: -200, y: 270, w: 120, h: 20, t: "spike" },
      { x: 200, y: 270, w: 120, h: 20, t: "spike" },
      { x: 0, y: 270, w: 90, h: 20, t: "goal" },
    ] },
  { name: "Final Shift", cam: "fixed", view: 820, start: [-230, 178], par: [10, 20],
    hint: "Everything you've learned. Good luck.",
    objs: [
      ...box(300, 300),
      { x: -230, y: 200, w: 120, h: 16, t: "wall" },
      { x: 0, y: -290, w: 600, h: 20, t: "spike" },
      { x: -100, y: 290, w: 400, h: 20, t: "spike" },
      { x: -40, y: -20, w: 260, h: 18, t: "spike", spin: 90 },
      { x: 290, y: 150, w: 20, h: 240, t: "spike" },
      // goal sits in a pocket on the right wall, guarded by a sliding spike
      { x: 255, y: -152, w: 90, h: 16, t: "wall" },
      { x: 255, y: -48, w: 90, h: 16, t: "wall" },
      { x: 195, y: -100, w: 20, h: 60, t: "spike", m: [0, 80, 2] },
      { x: 290, y: -100, w: 20, h: 70, t: "goal" },
    ] },

  // ── Chapter 5: Second wind ─────────────────────────────
  { name: "Moving Spring", cam: "fixed", view: 720, start: [-200, -82], par: [4, 8],
    hint: "The floor bites. Catch the moving pad.",
    objs: [
      ...box(260, 260),
      { x: -200, y: -60, w: 100, h: 16, t: "wall" },
      { x: 0, y: 250, w: 520, h: 20, t: "spike" },
      { x: 0, y: 228, w: 90, h: 16, t: "bounce", m: [180, 0, 2.5] },
      { x: 250, y: 60, w: 20, h: 380, t: "spike" },
      { x: 0, y: -250, w: 520, h: 20, t: "spike" },
      { x: 180, y: -100, w: 100, h: 20, t: "goal" },
    ] },
  { name: "Pendulum", cam: "fixed", view: 720, start: [0, -222], par: [4, 8],
    hint: "Two blades swinging in opposite directions.",
    objs: [
      ...box(260, 260),
      { x: 0, y: -200, w: 100, h: 16, t: "wall" },
      { x: 0, y: -60, w: 140, h: 24, t: "spike", m: [150, 0, 2.2] },
      { x: 0, y: 90, w: 140, h: 24, t: "spike", m: [-150, 0, 2.2] },
      { x: -250, y: 180, w: 20, h: 140, t: "spike" },
      { x: 250, y: 180, w: 20, h: 140, t: "spike" },

    ] },
  { name: "Keyhole", cam: "fixed", view: 720, start: [-180, -222], par: [8, 16],
    hint: "One tiny gap. Line it up, drop through, then dodge.",
    objs: [
      ...box(240, 240),
      { x: -180, y: -200, w: 100, h: 16, t: "wall" },
      { x: -135, y: 0, w: 210, h: 20, t: "wall" },
      { x: 135, y: 0, w: 210, h: 20, t: "wall" },
      { x: -40, y: 230, w: 240, h: 20, t: "spike" },

    ] },
  { name: "Trampoline", cam: "fixed", view: 860, bounds: 700, start: [-300, -24], par: [4, 8],
    hint: "Use the pad to reach the high ground.",
    objs: [
      { x: -300, y: 0, w: 100, h: 20, t: "wall" },
      { x: -60, y: 220, w: 140, h: 20, t: "bounce" },

  { name: "Sync", cam: "fixed", view: 820, start: [0, -302], par: [4, 8],

  }
  recordGhost();
  if (level.bounds && Math.hypot(ball.x, ball.y) > level.bounds) return die("void");

  // rolling spin uses on-screen horizontal speed
  const sx = ball.vx * Math.cos(angle) - ball.vy * Math.sin(angle);
  ball.spin += sx / BALL_R * dt;
  trail.push({ x: ball.x, y: ball.y }); if (trail.length > 18) trail.shift();
  if (level.cam === "follow") { const k = Math.min(1, dt * 6); cam.x += (ball.x - cam.x) * k; cam.y += (ball.y - cam.y) * k; }
}

function die(kind) {
  state = "dead"; deadT = 0.75; deaths.n++; shake = 1;
  burst(ball.x, ball.y, "#ff4d6d", 34);
  if (kind === "void") Sfx.fall(); else Sfx.spike();
  buzz([30, 40, 60]);
  const st = stat();
  st.deaths++; st[kind === "void" ? "voids" : "spikes"]++; st.time += timer;
  st.spots.push([Math.round(ball.x), Math.round(ball.y)]); if (st.spots.length > 60) st.spots.shift();
  runOpen = false; saveStats();
}
function win() {
  state = "won";
  burst(ball.x, ball.y, "#4fd18b", 40);
  Sfx.win();
  buzz([20, 60, 20, 60, 40]);
  const t = timer, st = t <= level.par[0] ? 3 : t <= level.par[1] ? 2 : 1;
  const ls = stat();
  ls.wins++; ls.time += t; if (!ls.firstWin) ls.firstWin = ls.tries;
  if (ls.best === null || t < ls.best) ls.best = Math.round(t * 100) / 100;
  runOpen = false; saveStats();
  // keep the fastest run as a ghost
  recordGhost(true);
  const gk = level.name;
  if (!ghosts[gk] || t < ghosts[gk].t) { ghosts[gk] = { t, p: rec }; try { localStorage.setItem("ws_ghosts", JSON.stringify(ghosts)); } catch (e) {} }
  const prev = progress[levelIdx] || 0;
  if (st > prev) { progress[levelIdx] = st; try { localStorage.setItem("ws_progress", JSON.stringify(progress)); } catch (e) {} }
  const wonLevel = levelIdx;
  setTimeout(() => {
    if (state !== "won" || levelIdx !== wonLevel) return; // player restarted / left meanwhile
    document.getElementById("winStars").textContent = "★".repeat(st) + "☆".repeat(3 - st);
    document.getElementById("winInfo").textContent = `Time ${t.toFixed(2)}s · Deaths ${deaths.n} · 3★ under ${level.par[0]}s`;
    document.getElementById("bNext").textContent = levelIdx < LEVELS.length - 1 ? "Next ▶" : "Menu";
    show("win");
    for (let i = 0; i < st; i++) Sfx.star(i);
  }, 650);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 320;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, color });
  }
}
function updateParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Render ----------
function render(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, "#14142a"); g.addColorStop(1, "#05050b");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!level) return;

  const scale = Math.min(W, H) / level.view;
  const R = Math.hypot(W, H) / 2;

  // starfield rotates with the world so turning is always readable
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(angle);
  for (const s of stars) { ctx.globalAlpha = s.a; ctx.fillStyle = "#c9c9ff"; ctx.fillRect(s.x * R, s.y * R, s.s, s.s); }
  ctx.restore(); ctx.globalAlpha = 1;

  ctx.save();
  const sh = shake * 8;
  ctx.translate(W / 2 + (Math.random() - 0.5) * sh, H / 2 + (Math.random() - 0.5) * sh);
  ctx.scale(scale, scale);
  ctx.rotate(angle);
  ctx.translate(-cam.x, -cam.y);

  if (level.bounds) {
    ctx.strokeStyle = "rgba(255,77,109,0.18)"; ctx.lineWidth = 3; ctx.setLineDash([14, 14]);
    ctx.beginPath(); ctx.arc(0, 0, level.bounds, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }

  for (const o of level.objs) drawObj(o, now);

  if (showDeaths && stats[level.name]) { // designer view: where players died
    ctx.strokeStyle = "rgba(255,90,120,0.75)"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (const [x, y] of stats[level.name].spots) { ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7); }
    ctx.stroke();
  }

  // best-run ghost
  if (ghost && dropped && (state === "play" || state === "dead") && timer <= ghost.t + 0.4) {
    const n = ghost.p.length / 2, k = Math.min(n - 1, Math.floor(timer * GHOST_HZ));
    ctx.globalAlpha = 0.28; ctx.fillStyle = "#9fe8ff";
    ctx.beginPath(); ctx.arc(ghost.p[2 * k], ghost.p[2 * k + 1], BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // where you'll fall (first few levels only)
  if (levelIdx < GUIDE_LEVELS && state === "play") {
    const { pts, end } = predictPath();
    const col = end === "goal" ? "79,209,139" : end ? "255,77,109" : "220,225,255";
    pts.forEach(([x, y], j) => {
      ctx.globalAlpha = 0.65 * (1 - j / (pts.length + 2)); ctx.fillStyle = `rgb(${col})`;
      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
    });
    if (end && pts.length) {
      const [x, y] = pts[pts.length - 1];
      ctx.globalAlpha = 0.8; ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, BALL_R, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // trail
  for (let i = 0; i < trail.length; i++) {
    const p = trail[i], a = i / trail.length;
    ctx.globalAlpha = a * 0.35; ctx.fillStyle = "#9fb4ff";
    ctx.beginPath(); ctx.arc(p.x, p.y, BALL_R * a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state !== "dead") drawBall(now);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // "down" marker: gravity always points to screen bottom
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath(); ctx.moveTo(W / 2 - 9, H - 46); ctx.lineTo(W / 2 + 9, H - 46); ctx.lineTo(W / 2, H - 34); ctx.fill();

  if (state === "dead") { ctx.fillStyle = `rgba(255,40,70,${Math.min(0.35, deadT * 0.5)})`; ctx.fillRect(0, 0, W, H); }
  if (state === "play" && freeze > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "bold 22px system-ui"; ctx.textAlign = "center";
    ctx.fillText("Ready…", W / 2, H * 0.3);
  } else if (state === "play" && waiting) {
    const a = 0.55 + 0.35 * Math.sin(now / 220);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.font = "bold 24px system-ui"; ctx.textAlign = "center";
    ctx.fillText(COARSE ? "Tap to drop" : "Click or press Space to drop", W / 2, H * 0.3);
  }

  document.getElementById("stats").textContent = `⏱ ${timer.toFixed(1)}s   ☠ ${deaths.n}`;
}

function drawObj(o, now) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o._ang);
  const hw = o.w / 2, hh = o.h / 2;
  if (o.t === "wall") {
    ctx.fillStyle = "#23233f"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#6b6bff"; ctx.lineWidth = 2; ctx.shadowColor = "#6b6bff"; ctx.shadowBlur = 10;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
  } else if (o.t === "spike") {
    ctx.fillStyle = "#3a0f1c"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.fillStyle = "#ff4d6d"; ctx.shadowColor = "#ff4d6d"; ctx.shadowBlur = 12;
    const horiz = o.w >= o.h, len = horiz ? o.w : o.h, th = horiz ? o.h : o.w, n = Math.max(2, Math.round(len / 18)), step = len / n;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = -len / 2 + i * step, b = a + step, m = a + step / 2;
      if (horiz) {
        ctx.moveTo(a, -th / 2); ctx.lineTo(m, -th / 2 - 10); ctx.lineTo(b, -th / 2);
        ctx.moveTo(a, th / 2); ctx.lineTo(m, th / 2 + 10); ctx.lineTo(b, th / 2);
      } else {
        ctx.moveTo(-th / 2, a); ctx.lineTo(-th / 2 - 10, m); ctx.lineTo(-th / 2, b);
        ctx.moveTo(th / 2, a); ctx.lineTo(th / 2 + 10, m); ctx.lineTo(th / 2, b);
      }
    }
    ctx.fill();
  } else if (o.t === "goal") {
    const pulse = 0.6 + 0.4 * Math.sin(now / 250);
    ctx.fillStyle = "#123d29"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#4fd18b"; ctx.lineWidth = 3; ctx.shadowColor = "#4fd18b"; ctx.shadowBlur = 18 * pulse;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
  } else if (o.t === "ice") {
    ctx.fillStyle = "#0f3040"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#8fe3ff"; ctx.lineWidth = 2; ctx.shadowColor = "#8fe3ff"; ctx.shadowBlur = 10;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
    ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(220,248,255,0.55)"; ctx.lineWidth = 1.5;
    ctx.save(); ctx.beginPath(); ctx.rect(-hw, -hh, o.w, o.h); ctx.clip();
    ctx.beginPath();
    for (let x = -hw - o.h; x < hw; x += 26) { ctx.moveTo(x, hh); ctx.lineTo(x + o.h, -hh); }
    ctx.stroke(); ctx.restore();
  } else if (o.t === "glue") {
    ctx.fillStyle = "#2a3a08"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#b6e34f"; ctx.lineWidth = 2.5; ctx.shadowColor = "#b6e34f"; ctx.shadowBlur = 12;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
    ctx.shadowBlur = 0; ctx.fillStyle = "#b6e34f";
    const horiz = o.w >= o.h, len = horiz ? o.w : o.h, th = (horiz ? o.h : o.w) / 2;
    for (let a = -len / 2 + 10; a < len / 2 - 4; a += 16) { // little drips on both faces
      const r = 2.5 + 1.5 * Math.sin(a * 1.7 + now / 400);
      ctx.beginPath();
      if (horiz) { ctx.arc(a, th + r * 0.6, r, 0, Math.PI * 2); ctx.arc(a + 8, -th - r * 0.6, r * 0.8, 0, Math.PI * 2); }
      else { ctx.arc(th + r * 0.6, a, r, 0, Math.PI * 2); ctx.arc(-th - r * 0.6, a + 8, r * 0.8, 0, Math.PI * 2); }
      ctx.fill();
    }
  } else if (o.t === "portal") {
    const col = PORTAL_COLORS[o.link] || "#b36bff", r = Math.min(hw, hh);
    ctx.rotate(-o._ang); // portals look the same from every side
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, "#05050b"); g.addColorStop(0.7, "#14082a"); g.addColorStop(1, col);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 18;
    ctx.setLineDash([7, 6]); ctx.lineDashOffset = -now / 40;
    ctx.beginPath(); ctx.arc(0, 0, r - 2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([4, 8]); ctx.lineDashOffset = now / 60;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  } else if (o.t === "bounce") {
    ctx.fillStyle = "#4a2a08"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#ffa640"; ctx.lineWidth = 2; ctx.shadowColor = "#ffa640"; ctx.shadowBlur = 12;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
    ctx.beginPath();
    for (let x = -hw + 12; x < hw - 6; x += 18) { ctx.moveTo(x - 5, 3); ctx.lineTo(x, -3); ctx.lineTo(x + 5, 3); }
    ctx.stroke();
  }
  ctx.restore();
}

function drawBall(now) {
  ctx.save(); ctx.translate(ball.x, ball.y);
  ctx.shadowColor = "#cfd8ff"; ctx.shadowBlur = 20;
  ctx.fillStyle = "#f2f4ff"; ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.rotate(ball.spin - angle);
  ctx.strokeStyle = "#5a6aa8"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-BALL_R * 0.6, 0); ctx.lineTo(BALL_R * 0.6, 0); ctx.stroke();
  if (state === "play" && freeze > 0) {
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, BALL_R + 6 + freeze * 30, 0, Math.PI * 2); ctx.stroke();
  } else if (state === "play" && waiting) {
    const p = (now / 900) % 1; // expanding "ping" ring while the ball waits
    ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - p)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, BALL_R + 4 + p * 22, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Input ----------
// first tap / click / key after a level loads releases the ball (a tap during "Ready…" queues it)
function launch() {
  if (state !== "play" || !waiting || isShown("menu") || isShown("win")) return false;
  waiting = false;
  return true;
}

const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
window.addEventListener("keydown", e => {
  if (["Space", "Enter", "KeyQ", "KeyE"].includes(e.code) || KEYMAP[e.code]) {
    if (launch() && (e.code === "Space" || e.code === "Enter")) { e.preventDefault(); return; }
  }
  if (KEYMAP[e.code]) {
    keys[KEYMAP[e.code]] = true;
    if (snapMode && !e.repeat && state === "play") { targetAngle += (KEYMAP[e.code] === "right" ? 1 : -1) * Math.PI / 2; Sfx.snap(); }
    e.preventDefault();
  }
  if (e.code === "KeyQ" && state === "play") { snapTo(-1); }
  if (e.code === "KeyE" && state === "play") { snapTo(1); }
  if (e.code === "KeyR") restart();
  if (e.code === "KeyM") toggleMode();
  if ((e.code === "Enter" || e.code === "Space") && isShown("win")) next();
});
window.addEventListener("keyup", e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });

function snapTo(dir) {
  // in smooth mode Q/E still work: jump the target to the next quarter turn
  if (!snapMode) { targetAngle = angle; }
  const q = Math.PI / 2;
  targetAngle = (dir > 0 ? Math.floor(targetAngle / q + 1e-6) + 1 : Math.ceil(targetAngle / q - 1e-6) - 1) * q;
  if (!snapMode) animateSnap();
  Sfx.snap();
}
let snapAnim = null;
function animateSnap() {
  cancelAnimationFrame(snapAnim);
  const step = () => {
    const d = targetAngle - angle;
    if (Math.abs(d) < 0.002 || state !== "play") { if (state === "play") angle = targetAngle; return; }
    angle += d * 0.2; snapAnim = requestAnimationFrame(step);
  };
  step();
}

let drag = null;
cv.addEventListener("pointerdown", e => {
  // the tap that drops the ball shouldn't also count as a 90° snap tap
  drag = { x: e.clientX, y: e.clientY, x0: e.clientX, t: performance.now(), launch: launch() };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const px = drag.x, py = drag.y, nx = e.clientX, ny = e.clientY;
  drag.x = nx; drag.y = ny;
  if (snapMode || state !== "play") return;
  // dial: the world turns with the finger around the screen centre, so circling spins it all the way round
  const cx = W / 2, cy = H / 2;
  let dTheta = Math.atan2(ny - cy, nx - cx) - Math.atan2(py - cy, px - cx);
  if (dTheta > Math.PI) dTheta -= 2 * Math.PI; else if (dTheta < -Math.PI) dTheta += 2 * Math.PI;
  // near the centre the dial gets twitchy, so blend back to plain left/right drag there
  const r = Math.hypot(nx - cx, ny - cy);
  const w = Math.max(0, Math.min(1, (r - DIAL_INNER) / DIAL_BLEND));
  angle += w * dTheta - (1 - w) * (nx - px) * DRAG_RAD_PER_PX; // drag left → world turns left
});
cv.addEventListener("pointerup", e => {
  if (!drag) return;
  const moved = Math.abs(e.clientX - drag.x0);
  if (snapMode && state === "play" && moved < 15 && !drag.launch) { targetAngle += (e.clientX > W / 2 ? 1 : -1) * Math.PI / 2; Sfx.snap(); }
  drag = null;
});
cv.addEventListener("pointercancel", () => drag = null);

function toggleMode() {
  snapMode = !snapMode;
  targetAngle = Math.round(angle / (Math.PI / 2)) * (Math.PI / 2);
  angVel = 0;
  document.getElementById("bMode").textContent = snapMode ? "90° Snap" : "Smooth";
  const hint = document.getElementById("hint");
  hint.textContent = snapMode ? "90° mode: tap left/right side (or ← →) to turn a quarter." : "Smooth mode: drag or circle your finger (or hold ← →).";
  hint.style.opacity = 0.85;
}

// ---------- UI ----------
function show(id) { document.getElementById(id).classList.add("show"); }
function hide(id) { document.getElementById(id).classList.remove("show"); }
function isShown(id) { return document.getElementById(id).classList.contains("show"); }
function buildMenu() {
  const grid = document.getElementById("levelGrid"); grid.innerHTML = "";
  const CHAPTERS = { 0: "1 · Learn to turn", 5: "2 · Use the whole world", 10: "3 · Things that move", 15: "4 · Everything at once",
    20: "5 · Second wind", 25: "6 · Getting serious", 30: "7 · Precision", 35: "8 · Danger zone", 40: "9 · Expert", 45: "10 · Master",
    50: "11 · Strange matter", 55: "12 · Beyond" };
  LEVELS.forEach((l, i) => {
    if (CHAPTERS[i]) { const c = document.createElement("div"); c.className = "chap"; c.textContent = CHAPTERS[i]; grid.appendChild(c); }
    const b = document.createElement("button");
    const st = progress[i] || 0;
    b.innerHTML = `${i + 1}<small>${st ? "★".repeat(st) : ""}</small>`;
    b.title = l.name;
    b.onclick = () => loadLevel(i);
    grid.appendChild(b);
  });
}
function next() {
  hide("win");
  if (levelIdx < LEVELS.length - 1) loadLevel(levelIdx + 1); else { buildMenu(); show("menu"); }
}
// UI click sound on every button (level grid included)
document.addEventListener("click", e => { if (e.target.closest("button")) Sfx.click(); });
const bSound = document.getElementById("bSound");
bSound.textContent = Sfx.muted ? "🔇" : "🔊";
bSound.onclick = () => { bSound.textContent = Sfx.toggle() ? "🔇" : "🔊"; };
const bMusic = document.getElementById("bMusic");
const paintMusic = () => { bMusic.style.opacity = Sfx.musicOn ? 1 : 0.4; bMusic.style.textDecoration = Sfx.musicOn ? "none" : "line-through"; };
paintMusic();
bMusic.onclick = () => { Sfx.toggleMusic(); paintMusic(); };
document.getElementById("bMenu").onclick =() => { buildMenu(); show("menu"); state = state === "play" ? "paused" : state; };
document.getElementById("bRestart").onclick = restart;
document.getElementById("bMode").onclick = toggleMode;
document.getElementById("bRetry").onclick = () => { hide("win"); restart(); };
document.getElementById("bNext").onclick = next;
document.getElementById("menu").addEventListener("pointerdown", e => { if (e.target.id === "menu" && level) { hide("menu"); if (state === "paused") state = "play"; } });

// ---------- Stats screen ----------
function statsRows() {
  const rows = [];
  LEVELS.forEach((l, i) => {
    const st = stats[l.name];
    if (!st || !st.tries) return;
    rows.push({ n: i + 1, name: l.name, ...st, avg: st.time / st.tries, winPct: st.wins / st.tries });
  });
  return rows;
}
function openStats() {
  const rows = statsRows();
  const total = rows.reduce((a, r) => a + r.time, 0), beaten = rows.filter(r => r.wins).length;
  const furthest = rows.length ? Math.max(...rows.map(r => r.n)) : 0;
  document.getElementById("statsSummary").textContent = rows.length
    ? `${Math.round(total / 60)} min played · ${beaten} levels beaten · furthest level ${furthest} · red rows: hardest (lowest win rate, 3+ tries)`
    : "No data yet: play a few levels first.";
  const hard = rows.filter(r => r.tries >= 3).sort((a, b) => a.winPct - b.winPct).slice(0, 5).map(r => r.n);
  document.getElementById("statsTable").innerHTML =
    "<tr><th>#</th><th>Level</th><th>Tries</th><th>Wins</th><th>Win %</th><th>1st win on try</th><th>Spikes</th><th>Void</th><th>Resets</th><th>Gave up</th><th>Best</th><th>Avg try</th></tr>" +
    rows.map(r => `<tr class="${hard.includes(r.n) ? "hot" : ""}"><td>${r.n}</td><td>${r.name}</td><td>${r.tries}</td><td>${r.wins}</td><td>${Math.round(r.winPct * 100)}%</td>` +
      `<td>${r.firstWin || "–"}</td><td>${r.spikes}</td><td>${r.voids}</td><td>${r.resets}</td><td>${r.gaveUp}</td><td>${r.best !== null ? r.best + "s" : "–"}</td><td>${r.avg.toFixed(1)}s</td></tr>`).join("");
  document.getElementById("chkDeaths").checked = showDeaths;
  document.getElementById("statsText").style.display = "none";
  show("statsPanel");
}
function statsTSV() {
  const head = ["level", "name", "tries", "wins", "win_pct", "first_win_try", "spike_deaths", "void_deaths", "resets", "gave_up", "best_s", "avg_try_s"];
  const lines = statsRows().map(r => [r.n, r.name, r.tries, r.wins, Math.round(r.winPct * 100), r.firstWin, r.spikes, r.voids, r.resets, r.gaveUp, r.best ?? "", r.avg.toFixed(1)].join("\t"));
  return `World Shifter ${document.getElementById("ver").textContent} · ${new Date().toISOString().slice(0, 10)} · screen ${W}x${H}\n` + [head.join("\t"), ...lines].join("\n");
}
document.getElementById("bCopyStats").onclick = () => {
  const txt = statsTSV(), ta = document.getElementById("statsText"), btn = document.getElementById("bCopyStats");
  ta.value = txt; ta.style.display = "block";
  const done = () => { btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy", 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => ta.select());
  else { ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} }
};
document.getElementById("bResetStats").onclick = () => {
  if (!confirm("Delete all playtest stats on this device?")) return;
  stats = {}; saveStats(); openStats();
};
document.getElementById("bCloseStats").onclick = () => hide("statsPanel");
document.getElementById("chkDeaths").onchange = e => {
  showDeaths = e.target.checked;
  try { localStorage.setItem("ws_showdeaths", showDeaths ? "1" : "0"); } catch (err) {}
};
let verTaps = [];
document.getElementById("ver").addEventListener("click", () => {
  const now = performance.now();
  verTaps = verTaps.filter(t => now - t < 2000); verTaps.push(now);
  if (verTaps.length >= 5) { verTaps = []; openStats(); }
});
window.addEventListener("pagehide", () => { if (level) leaveRun(false); });

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (level) update(dt);
  render(now);
  requestAnimationFrame(frame);
}
buildMenu();
loadLevel(0); show("menu"); state = "paused";
if (/[?&]stats\b/.test(location.search)) openStats();
requestAnimationFrame(frame);
</script>
</body>
</html>
