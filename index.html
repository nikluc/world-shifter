<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>World Shifter — demo</title>
<style>
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  html,body{overscroll-behavior:none;margin:0;height:100%;background:#07070d;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8e8f0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
  /* fixed + inset instead of 100vh: on phones 100vh includes the hidden URL bar and stretches the canvas */
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
       padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);pointer-events:none;font-size:14px;z-index:3}
  #hud .info{flex:1;min-width:0;text-align:center;line-height:1.3;text-shadow:0 1px 3px #000}
  #hud .info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hud .btns{display:flex;gap:8px;flex:none}
  #hud button{pointer-events:auto}
  .icon{width:46px;height:46px;padding:0;border-radius:14px;font-size:21px;line-height:1;background:rgba(27,27,46,.85)}
  button{background:#1b1b2e;color:#e8e8f0;border:1px solid #3a3a5c;border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer;font-family:inherit;min-height:44px}
  button:active{transform:scale(.96)}
  button.primary{background:#2d6b4a;border-color:#4fd18b}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,12,.8);z-index:5}
  .overlay.show{display:flex}
  .panel{background:#11111e;border:1px solid #2c2c48;border-radius:18px;padding:20px 18px;max-width:440px;width:min(92vw,440px);text-align:center;
         max-height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .big{display:block;width:100%;padding:14px;font-size:19px;font-weight:600;margin-top:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .setrow{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:10px;padding:14px 16px;font-size:17px;text-align:left}
  .setrow span{color:#9fe8b8;font-weight:600}
  .setrow.off span{color:#8a8aa8}
  .help{font-size:13px;opacity:.7}
  .panel h1{margin:0 0 4px;font-size:26px;letter-spacing:1px}
  .panel h2{margin:0 0 8px;font-size:22px}
  .panel p{opacity:.8;margin:6px 0}
  .bar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 12px;font-size:15px;margin:14px 0 4px}
  .bar span{white-space:nowrap}
  .bar2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .bar2 button.ready{border-color:#ffd34d;background:#3a3010;animation:glow 1.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 14px #ffd34d88}}
  .wcard{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;border-radius:14px;border:1px solid #3a3a5c;
         background:linear-gradient(120deg,var(--c0),var(--c1));cursor:pointer}
  .wcard .t{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:600}
  .wcard .t small{font-weight:400;font-size:13px;opacity:.8}
  .wcard .pb{height:6px;border-radius:3px;background:#ffffff22;margin:8px 0 6px;overflow:hidden}
  .wcard .pb i{display:block;height:100%;background:#4fd18b}
  .wcard .s{font-size:13px;opacity:.85}
  .wcard.locked{opacity:.92}
  .wcard .lock{margin-top:8px;font-size:14px}
  .wcard .lock .acts{display:flex;gap:8px;margin-top:8px}
  .wcard .lock button{flex:1;min-height:40px;padding:6px 10px;font-size:14px}
  .wcard.here{border-color:#ffd34d}
  #levelView{display:none}
  .lvhead{display:flex;align-items:center;gap:10px;margin-top:12px}
  .lvhead b{flex:1;text-align:left}
  .lvhead button{min-height:40px;padding:6px 12px;font-size:14px}
  .grid button.lock{opacity:.35}
  .grid button.next{border-color:#ffd34d;box-shadow:0 0 10px #ffd34d55}
  .steps{display:flex;justify-content:center;gap:6px;margin:8px 0}
  .steps i{width:30px;height:30px;border-radius:8px;border:1px solid #3a3a5c;font-style:normal;font-size:12px;line-height:30px}
  .steps i.done{background:#2d6b4a;border-color:#4fd18b}
  .steps i.now{border-color:#ffd34d;color:#ffd34d}
  .skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .skins button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px}
  .skins button.on{border-color:#4fd18b}
  .skins .ball{width:44px;height:44px;border-radius:50%}
  .skins small{font-size:13px;opacity:.85}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:#11111ef2;border:1px solid #ffd34d;border-radius:14px;
         padding:14px 18px;font-size:16px;z-index:9;display:none;text-align:center;max-width:86vw}
  .pages{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0 0}
  .pages button{padding:6px 0;font-size:13px;line-height:1.2;min-height:40px}
  .pages button small{display:block;font-size:10px;color:#ffd34d;min-height:12px}
  .pages button.sel{border-color:#ffd34d;background:#2a2a40}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
  .grid button{padding:8px 0;font-size:17px;line-height:1.2;min-height:50px}
  .grid small{display:block;font-size:12px;color:#ffd34d;min-height:14px}
  .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .stars{font-size:34px;letter-spacing:6px;color:#ffd34d;margin:6px 0}
  .panel.wide{max-width:680px}
  .panel{touch-action:pan-y}
  .tbl{overflow-x:auto;touch-action:pan-x pan-y}
  .tbl table{border-collapse:collapse;width:100%;font-size:12px}
  .tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid #2c2c48;text-align:right;white-space:nowrap}
  .tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
  .tbl tr.hot td{color:#ff8da1}
  #offer{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 66px);display:none;justify-content:center;pointer-events:none;z-index:3}
  #offer.show{display:flex}
  #offer button{pointer-events:auto;background:rgba(45,107,74,.92);border-color:#4fd18b;font-size:15px;border-radius:22px;padding:8px 16px}
  #snapBtns{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);display:none;justify-content:space-between;padding:0 18px;pointer-events:none;z-index:2}
  #snapBtns.show{display:flex}
  #snapBtns button{pointer-events:auto;width:76px;height:76px;border-radius:50%;font-size:38px;line-height:1;padding:0;background:rgba(27,27,46,.85)}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;opacity:.8;pointer-events:none;font-size:14px;padding:0 calc(env(safe-area-inset-right) + 24px) 0 calc(env(safe-area-inset-left) + 24px);text-shadow:0 1px 3px #000;transition:opacity .6s}
  #snapBtns.show ~ #hint, body.snap #hint{padding:0 110px}
  /* short landscape phones: tighter panels */
  @media (max-height:500px){ .panel{padding:14px} .panel h1{font-size:21px} .grid{grid-template-columns:repeat(10,1fr)} .grid button{min-height:44px;font-size:15px} .pages{grid-template-columns:repeat(10,1fr)} #hint{font-size:12px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="btns"><button id="bMenu" class="icon" aria-label="Menu">☰</button><button id="bRestart" class="icon" aria-label="Restart">↻</button></div>
  <div class="info"><b id="lvlName"></b><span id="stats"></span></div>
  <div class="btns"><button id="bSettings" class="icon" aria-label="Settings">⚙</button></div>
</div>
<div id="hint"></div>
<div id="offer"><button id="bOffer"></button></div>
<div id="snapBtns"><button id="bRotL" aria-label="Turn left">⟲</button><button id="bRotR" aria-label="Turn right">⟳</button></div>

<div class="overlay show" id="menu">
  <div class="panel">
    <h1>WORLD SHIFTER</h1>
    <p>You don't move the ball. You turn the world.</p>
    <button id="bContinue" class="primary big">▶ Play</button>
    <button id="bDaily" class="big" style="font-size:16px;font-weight:500">📅 Daily challenge</button>
    <div class="bar" id="totals"></div>
    <div class="bar2"><button id="bGift">🎁 Daily gift</button><button id="bShop">🛍 Shop</button></div>
    <div id="worldList"></div>
    <div id="levelView">
      <div class="lvhead"><button id="bBackWorlds">← Worlds</button><b id="lvTitle"></b><span id="lvStars"></span></div>
      <div class="grid" id="levelGrid"></div>
    </div>
    <p class="help" id="helpText"></p>
    <p style="font-size:11px;opacity:.45" id="ver">prototype v0.16</p>
  </div>
</div>

<div class="overlay" id="statsPanel">
  <div class="panel wide">
    <h2>Playtest stats</h2>
    <p id="statsSummary" style="font-size:13px"></p>
    <div class="tbl"><table id="statsTable"></table></div>
    <label style="font-size:13px;display:block;margin-top:10px"><input type="checkbox" id="chkDeaths"> Show death spots (✕) inside levels</label>
    <div class="row"><button id="bCopyStats" class="primary">Copy</button><button id="bSaveStats">Save file</button><button id="bResetStats">Reset</button><button id="bCloseStats">Close</button></div>
    <textarea id="statsText" readonly style="display:none;width:100%;height:90px;margin-top:10px;font-size:11px;background:#07070d;color:#e8e8f0;border:1px solid #2c2c48"></textarea>
  </div>
</div>

<div class="overlay" id="settings">
  <div class="panel">
    <h2>Settings</h2>
    <button class="setrow" id="bMusic">♫ Music <span></span></button>
    <button class="setrow" id="bSound">🔊 Sound effects <span></span></button>
    <button class="setrow" id="bVibe">📳 Vibration <span></span></button>
    <button class="setrow" id="bMode">🎮 Controls <span></span></button>
    <p class="help" id="modeHelp"></p>
    <button class="primary big" id="bCloseSettings">Done</button>
  </div>
</div>

<div class="overlay" id="card">
  <div class="panel">
    <div id="cardIcon" style="font-size:44px;line-height:1.2"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText" style="font-size:16px"></p>
    <button class="primary big" id="bCard">Got it</button>
  </div>
</div>

<div class="overlay" id="ending">
  <div class="panel">
    <h1>You turned every world</h1>
    <p>All 500 levels of World Shifter, done.</p>
    <div class="stars" id="endStars"></div>
    <p id="endInfo"></p>
    <button class="primary big" id="bEndShare">Share</button>
    <button class="big" id="bEndMenu">Back to the menu</button>
  </div>
</div>

<div class="overlay" id="gift">
  <div class="panel">
    <div style="font-size:46px">🎁</div>
    <h2 id="giftTitle">Daily gift</h2>
    <div class="steps" id="giftSteps"></div>
    <p id="giftText" style="font-size:18px"></p>
    <button class="primary big" id="bGiftClaim">Claim</button>
    <button class="big" id="bGiftDouble">Claim ×2 · watch an ad</button>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="panel">
    <h2>Ball skins</h2>
    <p id="shopWallet"></p>
    <div class="skins" id="skinGrid"></div>
    <p class="help">Earn ◆ from hidden gems, daily gifts and streaks.</p>
    <button class="primary big" id="bShopClose">Done</button>
  </div>
</div>

<div id="toast"></div>

<div class="overlay" id="win">
  <div class="panel">
    <h2>Landed!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winInfo"></p>
    <p id="winGem" style="font-size:14px;margin:4px 0"></p>
    <button id="bNext" class="primary big">Next ▶</button>
    <div class="row2"><button id="bRetry">↻ Retry</button><button id="bShare">Share</button></div>
  </div>
</div>

<script>
"use strict";
// ---------- Tuning ----------
const G = 998;            // gravity, world units / s^2 (v0.11: 950 + 5% for a snappier ball; v0.10 tried 855, too floaty)
const MAX_SPEED = 1100;
const BALL_R = 14;
const ROT_SPEED = 2.6;    // rad/s for keyboard rotation
const DIAL_MIN_R = 70;    // px: drag turns the world like a dial around the screen centre; inside this
                         // radius it is damped (treated as if this far out) so it never gets twitchy
const SUBSTEPS = 5;
const START_FREEZE = 0.6; // seconds of "Ready…" before the player may drop the ball
const SFX_VOLUME = 0.5;   // master volume 0..1
const THUD_MIN_SPEED = 120; // impact speed below which wall hits are silent
const MUSIC_VOLUME = 0.6; // background music level, relative to the master volume
const GUIDE_LEVELS = 5;   // dotted "where you'll fall" preview on the first N levels
const GUIDE_AFTER_DEATHS = 20; // ...and on any level once you've died this many times on it
const GUIDE_TIME = 1.2;   // seconds of predicted path
const GHOST_HZ = 30;      // best-run ghost samples per second
const GLUE_RELEASE = 0.5; // glue lets go once gravity pulls away from it at >= this fraction of G (~60° turn)
const HIT_FEEDBACK_SPEED = 350; // wall hits harder than this shake the screen + vibrate

// ---------- Levels ----------
// objs: rect centred at x,y with size w,h, rotated a degrees. t: wall | spike | goal | bounce | ice | glue | portal
//   ice: no grip, barely bounces · glue: holds the ball until gravity pulls it away (GLUE_RELEASE)
//   portal: needs link: "a" — touching one sends the ball to the centre of the other with the same velocity
//   gem: optional collectible (one per level, placed by tools/place_gems.py); counts if you win in the same run
//   m: [dx, dy, period]  → slides back and forth by ±dx/±dy every `period` seconds
//   spin: degrees per second → rotates around its centre
// cam: 'follow' (world rotates around the ball) or 'fixed' (rotates around the level centre)
// bounds: open levels only — leave this circle and the void takes you
// par: [3-star seconds, 2-star seconds]
const box = (hw, hh, t = "wall") => [
  { x: 0, y: hh + 12, w: 2 * hw + 48, h: 24, t },
  { x: 0, y: -hh - 12, w: 2 * hw + 48, h: 24, t },
  { x: -hw - 12, y: 0, w: 24, h: 2 * hh + 48, t },
  { x: hw + 12, y: 0, w: 24, h: 2 * hh + 48, t },
];

const HAND_LEVELS = [
  // One run, easiest first: sorted by the level bot's difficulty score (attempts a
  // learning bot needs + how precise the timing must be), at G = 998. Each mechanic's
  // intro level (Slider, Bounce Gap, Sticky Start, Black Ice, First Portal) comes before
  // anything that uses it. Hand-placed: Hop Scotch late (playtest: hardest), Wall Walker late (harder at G 998), World's End last.



  // ── 1–10 ──────────────────────────────────────────────────
  { name: "Steer the Fall", cam: "follow", view: 820, bounds: 650, start: [0, -250], par: [4, 8],
    hint: "Drag or draw circles (or ← →) to rotate the world. Miss the spikes, land on the green pad.",
    objs: [
      { x: 0, y: 200, w: 140, h: 24, t: "spike" },
      { x: 190, y: 200, w: 160, h: 24, t: "goal" },
      { x: 18, y: -31, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Over the Wall", cam: "fixed", view: 720, start: [-150, 234], par: [7, 14],
    hint: "Turn the whole box to roll the ball over the wall.",
    objs: [
      ...box(250, 250),
      { x: 0, y: 60, w: 24, h: 380, t: "wall" },
      { x: 160, y: 240, w: 120, h: 20, t: "goal" },
      { x: 138, y: 134, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Upside Down", cam: "fixed", view: 720, start: [-170, 236], par: [4, 8],
    hint: "The goal is under the block. Roll into the cradle, then flip the world.",
    objs: [
      { x: -75, y: 238, w: 16, h: 24, t: "wall" },
      { x: 75, y: 238, w: 16, h: 24, t: "wall" },
      { x: 0, y: 262, w: 548, h: 24, t: "wall" },
      { x: 0, y: -262, w: 548, h: 24, t: "spike" },
      { x: -262, y: 0, w: 24, h: 548, t: "wall" },
      { x: 262, y: 0, w: 24, h: 548, t: "wall" },
      { x: -240, y: -140, w: 20, h: 180, t: "spike" },
      { x: 240, y: -140, w: 20, h: 180, t: "spike" },
      { x: 0, y: 0, w: 180, h: 60, t: "wall" },
      { x: 0, y: 40, w: 120, h: 20, t: "goal" },
      { x: 200, y: 73, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Zigzag", cam: "fixed", view: 820, start: [-170, -204], par: [12, 24],
    hint: "Shelf to shelf. Tilt, drop, tilt back.",
    objs: [
      ...box(220, 340),
      { x: -50, y: -180, w: 340, h: 20, t: "wall" },
      { x: 50, y: 0, w: 340, h: 20, t: "wall" },
      { x: -50, y: 180, w: 340, h: 20, t: "wall" },
      { x: -170, y: 330, w: 80, h: 20, t: "goal" },
      { x: 201, y: -316, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Slider", cam: "fixed", view: 720, start: [0, -212], par: [4, 8],
    hint: "Hazards move now. Wait for your moment.",
    objs: [
      ...box(250, 250),
      { x: 0, y: -190, w: 100, h: 16, t: "wall" },
      { x: 0, y: 20, w: 100, h: 24, t: "spike", m: [170, 0, 2.6] },
      { x: -240, y: 130, w: 20, h: 200, t: "spike" },
      { x: 240, y: 130, w: 20, h: 200, t: "spike" },
      { x: 0, y: 240, w: 100, h: 20, t: "goal" },
      { x: 194, y: 71, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Pendulum", cam: "fixed", view: 720, start: [0, -222], par: [4, 8],
    hint: "Two blades swinging in opposite directions.",
    objs: [
      ...box(260, 260),
      { x: 0, y: -200, w: 100, h: 16, t: "wall" },
      { x: 0, y: -60, w: 140, h: 24, t: "spike", m: [150, 0, 2.2] },
      { x: 0, y: 90, w: 140, h: 24, t: "spike", m: [-150, 0, 2.2] },
      { x: -250, y: 180, w: 20, h: 140, t: "spike" },
      { x: 250, y: 180, w: 20, h: 140, t: "spike" },
      { x: 0, y: 250, w: 100, h: 20, t: "goal" },
      { x: -205, y: 134, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Gears", cam: "fixed", view: 760, start: [0, -252], par: [4, 8],
    hint: "Two blades turning against each other.",
    objs: [
      ...box(280, 280),
      { x: 0, y: -230, w: 100, h: 16, t: "wall" },
      { x: 0, y: -70, w: 220, h: 18, t: "spike", spin: 70 },
      { x: 0, y: 110, w: 220, h: 18, t: "spike", spin: -70 },
      { x: -180, y: 270, w: 200, h: 20, t: "spike" },
      { x: 180, y: 270, w: 200, h: 20, t: "spike" },
      { x: 0, y: 270, w: 100, h: 20, t: "goal" },
      { x: -148, y: 110, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Labyrinth", cam: "fixed", view: 820, start: [-240, -128], par: [12, 24],
    hint: "Snake down through the gaps. Spikes at the bottom: go across the ceiling instead.",
    objs: [
      ...box(300, 300),
      { x: -60, y: -100, w: 480, h: 24, t: "wall" },
      { x: 60, y: 100, w: 480, h: 24, t: "wall" },
      { x: 0, y: 295, w: 110, h: 24, t: "spike" },
      { x: 250, y: 290, w: 70, h: 20, t: "goal" },
      { x: -51, y: 248, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Keyhole", cam: "fixed", view: 720, start: [-180, -222], par: [6, 12],
    hint: "One tiny gap. Line it up, drop through, then dodge.",
    objs: [
      ...box(240, 240),
      { x: -180, y: -200, w: 100, h: 16, t: "wall" },
      { x: -135, y: 0, w: 210, h: 20, t: "wall" },
      { x: 135, y: 0, w: 210, h: 20, t: "wall" },
      { x: -40, y: 230, w: 240, h: 20, t: "spike" },
      { x: 180, y: 230, w: 80, h: 20, t: "goal" },
      { x: -167, y: 122, w: 26, h: 26, t: "gem" },
    ] },
  { name: "Blade Run", cam: "fixed", view: 880, start: [-370, 106], par: [7, 14],
    hint: "Three blades in a corridor. Go when they lie flat.",
    objs: [
      ...box(400, 120),
      { x: -200, y: 0, w: 200, h: 16, t: "spike", spin: 90 },
      { x: 0, y: 0, w: 200, h: 16, t: "spike", spin: -90 },
      { x: 200, y: 0, w: 200, h: 16, t: "spike", spin: 120 },

// ---------- Generated levels ----------
// A generated level is stored as a recipe [type, seed, difficulty 0..1, 3★ seconds, gem?] and rebuilt the
// same way every time by genLevel(). tools/gen_levels.py tries thousands of recipes, and the level
// bot keeps only ones a human can win (sloppy timing) that a single fixed tilt can't (no shortcut).
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const GEN_A = ["Quiet", "Crimson", "Hollow", "Tilted", "Silent", "Broken", "Velvet", "Iron", "Glass", "Bitter", "Lucky", "Restless", "Frozen", "Burning", "Lonely", "Crooked", "Golden", "Hidden", "Narrow", "Wild", "Sleepy", "Hungry", "Twisted", "Distant", "Fragile", "Sudden", "Gentle", "Rusty", "Shimmering", "Upside"];
const GEN_B = ["Drop", "Gate", "Spiral", "Chamber", "Ledge", "Drift", "Corner", "Shaft", "Garden", "Orbit", "Maze", "Ramp", "Hollow", "Crossing", "Well", "Ladder", "Passage", "Vault", "Turn", "Cradle", "Fall", "Edge", "Loop", "Pocket", "Rift", "Teeth", "Lantern", "Harbor", "Echo", "Hinge"];
const GEN_HINTS = {
  room: ["Find the way through. Every room has one.", "Look before you drop.", "Turn the room until the path appears.", "Some walls are friends. Some bite."],
  corridor: ["One long hall. Watch the rhythm.", "Floor or ceiling? Choose at every gap.", "Keep moving. Hesitation gets you hit."],
  void: ["Nothing to hold on to out here.", "The void is patient. Be precise.", "Pick a line and commit."],
  tower: ["All the way through the tower.", "Switch sides at every floor.", "Gravity is whatever you say it is."],
};
const GEN_TYPES = ["room", "corridor", "void", "tower"];

function genLevel(spec) {

  const r = (a, b) => a + R() * (b - a), ri = (a, b) => Math.floor(r(a, b + 1));

  const rd = v => Math.round(v);
  const objs = [], zones = [];

  const rdist = (o, x, y) => {
    const a = (o.a || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), dx = x - o.x, dy = y - o.y;
    const lx = dx * c + dy * s, ly = -dx * s + dy * c;
    const sw = Math.abs(o.m ? o.m[0] : 0) + (o.spin ? Math.max(o.w, o.h) / 2 : 0), sh = Math.abs(o.m ? o.m[1] : 0) + (o.spin ? Math.max(o.w, o.h) / 2 : 0);
    return Math.hypot(Math.max(Math.abs(lx) - o.w / 2 - sw, 0), Math.max(Math.abs(ly) - o.h / 2 - sh, 0));
  };
  const free = o => zones.every(([x, y, rr]) => rdist(o, x, y) > rr);

    const ux = alongW ? Math.cos(a) : -Math.sin(a), uy = alongW ? Math.sin(a) : Math.cos(a);
    for (const t of [-0.5, -0.25, 0, 0.25, 0.5]) {
      const px = o.x + ux * t * long, py = o.y + uy * t * long;
      for (let k = firstPiece; k < objs.length; k++) if (rdist(objs[k], px, py) < 30 + Math.min(o.w, o.h) / 2) return false;

const WORLD_SIZE = 50;

// ---- streak: one per day with a win; freezes cover missed days ----
function bumpStreak() {
  const d = localDay(), s = econ.streak;
  if (s.last === d) return null;
  let used = 0;
  if (!s.last) s.n = 1;
  else {
    const gap = dayGap(s.last, d);
    if (gap === 1) s.n++;
    else if (gap > 1 && gap - 1 <= s.freeze) { used = gap - 1; s.freeze -= used; s.n++; }
    else s.n = 1;
  }
  s.last = d; s.best = Math.max(s.best, s.n);
  const bonus = ECON.streakBonus[s.n] || 0;
  econ.wallet += bonus;
  if (s.n % ECON.freezeEvery === 0 && s.freeze < ECON.maxFreezes) s.freeze++;
  saveEcon();
  Platform.event("streak", { days: s.n, bonus, freezesUsed: used });
  return { n: s.n, bonus, used };
}

let slowFrames = 0, fastFrames = 0;
function watchFrameRate(rawMs) {

// ---------- Update ----------
function update(dt) {
  // hint fades after a few seconds
  if (state === "play" && timer > 3.5) document.getElementById("hint").style.opacity = 0;

  if (state === "dead") { deadT -= dt; if (deadT <= 0) restart(); }
  updateParticles(dt);
  shake = Math.max(0, shake - dt * 3);
  if (state === "play" || state === "dead") { worldT += dt; placeObjs(worldT); }
  if (state !== "play") return;

  // rotation input
  if (snapMode) {
    angle += (targetAngle - angle) * Math.min(1, dt * 10);
  } else {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    angVel += (dir * ROT_SPEED - angVel) * Math.min(1, dt * 14);
    angle += angVel * dt;
  }

  if (freeze > 0) { freeze -= dt; return; }
  // hold the ball until the player taps / clicks / presses a key, or turns the world any way at all
  // (drag, keys, 90° buttons): turning the map starts the run too
  if (waiting && Math.abs(angle) > 0.02) launch();
  if (waiting) return;
  if (!dropped) { dropped = true; Sfx.drop(); stat().tries++; runOpen = true; Platform.event("level_start", { level: levelIdx + 1, name: level.name }); }
  Platform.setPlaying(true);
  timer += dt;

  const gx = Math.sin(angle) * G, gy = Math.cos(angle) * G;
  const h = dt / SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++) {
    const end = physStep(ball, gx, gy, h, onBallEvent);
    if (end === "spike") return die("spike");
    if (end === "goal") return win();
  }
  recordGhost();
  if (level.bounds && Math.hypot(ball.x, ball.y) > level.bounds) return die("void");

  // rolling spin uses on-screen horizontal speed
  const sx = ball.vx * Math.cos(angle) - ball.vy * Math.sin(angle);
  ball.spin += sx / BALL_R * dt;
  trail.push({ x: ball.x, y: ball.y }); if (trail.length > 18) trail.shift();
  if (level.cam === "follow") { const k = Math.min(1, dt * 6); cam.x += (ball.x - cam.x) * k; cam.y += (ball.y - cam.y) * k; }
}

function die(kind) {

  if (kind === "void") Sfx.fall(); else Sfx.spike();
  buzz([30, 40, 60]);
  const st = stat();
  st.deaths++; st[kind === "void" ? "voids" : "spikes"]++; st.time += timer;
  st.spots.push([Math.round(ball.x), Math.round(ball.y)]); if (st.spots.length > 60) st.spots.shift();

}
function win() {

  const ls = stat();
  ls.wins++; ls.time += t; if (!ls.firstWin) ls.firstWin = ls.tries;
  if (ls.best === null || t < ls.best) ls.best = Math.round(t * 100) / 100;
  runOpen = false; saveStats();

  const gk = level.name;
  if (!ghosts[gk] || t < ghosts[gk].t) { ghosts[gk] = { t, p: rec }; try { localStorage.setItem("ws_ghosts", JSON.stringify(ghosts)); } catch (e) {} }
  const prev = progress[level.name] || 0;
  if (st > prev) { progress[level.name] = st; try { localStorage.setItem("ws_stars", JSON.stringify(progress)); } catch (e) {} }
  const gem = level.objs.find(o => o.t === "gem"), gotGem = !!(gem && gem.got);
  let gemGain = 0;
  if (gotGem && !gems[level.name]) { gems[level.name] = true; gemGain = ECON.gemValue; econ.wallet += gemGain; try { localStorage.setItem("ws_gems", JSON.stringify(gems)); } catch (e) {} }
  if (econ.skipped[level.name]) delete econ.skipped[level.name];
  const streak = window.__botQuiet ? null : bumpStreak();
  saveEcon();
  Platform.event("level_complete", { level: levelIdx + 1, time: Math.round(t * 100) / 100, stars: st, deaths: deaths.n, gem: !!gotGem });
  lastWin = { n: levelIdx + 1, name: level.name, st, t, deaths: deaths.n, gem: gem ? gotGem : null, daily: dailyRun ? today() : null };
  if (dailyRun && (!daily[today()] || t < daily[today()])) { daily[today()] = Math.round(t * 100) / 100; try { localStorage.setItem("ws_daily", JSON.stringify(daily)); } catch (e) {} }
  const wonLevel = levelIdx;
  setTimeout(() => {
    if (state !== "won" || levelIdx !== wonLevel) return; // player restarted / left meanwhile
    document.getElementById("winStars").textContent = "★".repeat(st) + "☆".repeat(3 - st);
    document.getElementById("winInfo").textContent = `Time ${t.toFixed(2)}s · Deaths ${deaths.n} · 3★ under ${level.par[0]}s`;
    document.getElementById("winGem").innerHTML = !gem ? "" : gotGem ? '<span style="color:#ff6ad5">◆ Gem collected</span>'
      : gems[level.name] ? '<span style="opacity:.6">◆ Gem already found earlier</span>' : '<span style="opacity:.6">◇ A gem is hidden somewhere here…</span>';
    document.getElementById("bShare").textContent = "Share";
    const extra = [];
    if (gemGain) extra.push(`<span style="color:#ff6ad5">+${gemGain} ◆</span>`);
    if (streak) extra.push(`🔥 ${streak.n}-day streak` + (streak.bonus ? ` · <span style="color:#ff6ad5">+${streak.bonus} ◆</span>` : "") + (streak.used ? " · ❄ freeze used" : ""));
    if (extra.length) document.getElementById("winGem").innerHTML += "<br>" + extra.join(" · ");
    document.getElementById("bNext").textContent = dailyRun ? "Back to the menu" : levelIdx < LEVELS.length - 1 ? "Next ▶" : "Finish ▶";
    show("win");

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 320;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, color });

function updateParticles(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }

// ---------- Render ----------
function render(now) {

  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, wd.c0); g.addColorStop(1, wd.c1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!level) return;

  const scale = Math.min(W, H) / level.view;
  const R = Math.hypot(W, H) / 2;

  // starfield rotates with the world so turning is always readable
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(angle);
  for (const s of stars) { ctx.globalAlpha = s.a; ctx.fillStyle = wd.star; ctx.fillRect(s.x * R, s.y * R, s.s, s.s); }
  ctx.restore(); ctx.globalAlpha = 1;

  ctx.save();
  const sh = shake * 8;
  ctx.translate(W / 2 + (Math.random() - 0.5) * sh, H / 2 + (Math.random() - 0.5) * sh);
  ctx.scale(scale, scale);
  ctx.rotate(angle);
  ctx.translate(-cam.x, -cam.y);

  if (level.bounds) {
    ctx.strokeStyle = "rgba(255,77,109,0.18)"; ctx.lineWidth = 3; ctx.setLineDash([14, 14]);
    ctx.beginPath(); ctx.arc(0, 0, level.bounds, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }

  for (const o of level.objs) drawObj(o, now);

  if (showDeaths && stats[level.name]) { // designer view: where players died
    ctx.strokeStyle = "rgba(255,90,120,0.75)"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (const [x, y] of stats[level.name].spots) { ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7); }
    ctx.stroke();
  }

  // best-run ghost
  if (ghost && dropped && (state === "play" || state === "dead") && timer <= ghost.t + 0.4) {
    const n = ghost.p.length / 2, k = Math.min(n - 1, Math.floor(timer * GHOST_HZ));
    ctx.globalAlpha = 0.28; ctx.fillStyle = "#9fe8ff";
    ctx.beginPath(); ctx.arc(ghost.p[2 * k], ghost.p[2 * k + 1], BALL_R, 0, Math.PI * 2); ctx.fill();

  if (guideOn() && state === "play") {
    const { pts, end } = predictPath();
    const col = end === "goal" ? "79,209,139" : end ? "255,77,109" : "220,225,255";
    pts.forEach(([x, y], j) => {

      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();

    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;

  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath(); ctx.moveTo(W / 2 - 9, H - 46); ctx.lineTo(W / 2 + 9, H - 46); ctx.lineTo(W / 2, H - 34); ctx.fill();

  if (state === "dead") { ctx.fillStyle = `rgba(255,40,70,${Math.min(0.35, deadT * 0.5)})`; ctx.fillRect(0, 0, W, H); }
  if (tutorialOn()) drawTutorial(now);

  if (state === "play" && (freeze > 0 || waiting)) {

    const a = freeze > 0 ? 0.75 : 0.6 + 0.3 * Math.sin(now / 220);

    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText(txt, W / 2, y);

  document.getElementById("stats").textContent = `⏱ ${timer.toFixed(1)}s   ☠ ${deaths.n}` + (hudGem ? `   ${hudGem.got ? "◆" : "◇"}` : "");

function drawGem(o, now) {
  const r = 12, bob = Math.sin(now / 320 + o.x) * 3, pulse = 0.65 + 0.35 * Math.sin(now / 200);
  ctx.save(); ctx.translate(o.x, o.y + bob); ctx.rotate(-angle); // always upright on screen
  ctx.shadowColor = "#ff6ad5"; ctx.shadowBlur = 18 * pulse;

  ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.35, -r * 0.2); ctx.lineTo(0, r * 0.15); ctx.lineTo(-r * 0.35, -r * 0.2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawObj(o, now) {
  if (o.t === "gem") { if (!o.got) drawGem(o, now); return; }
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o._ang);
  const hw = o.w / 2, hh = o.h / 2;

    ctx.strokeRect(-hw, -hh, o.w, o.h);

    ctx.fillStyle = "#3a0f1c"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.fillStyle = "#ff4d6d"; ctx.shadowColor = "#ff4d6d"; ctx.shadowBlur = 12;
    const horiz = o.w >= o.h, len = horiz ? o.w : o.h, th = horiz ? o.h : o.w, n = Math.max(2, Math.round(len / 18)), step = len / n;
    ctx.beginPath();

      } else {
        ctx.moveTo(-th / 2, a); ctx.lineTo(-th / 2 - 10, m); ctx.lineTo(-th / 2, b);
        ctx.moveTo(th / 2, a); ctx.lineTo(th / 2 + 10, m); ctx.lineTo(th / 2, b);

    ctx.fill();
  } else if (o.t === "goal") {
    const pulse = 0.6 + 0.4 * Math.sin(now / 250);
    ctx.fillStyle = "#123d29"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#4fd18b"; ctx.lineWidth = 3; ctx.shadowColor = "#4fd18b"; ctx.shadowBlur = 18 * pulse;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
  } else if (o.t === "ice") {
    ctx.fillStyle = "#0f3040"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#8fe3ff"; ctx.lineWidth = 2; ctx.shadowColor = "#8fe3ff"; ctx.shadowBlur = 10;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
    ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(220,248,255,0.55)"; ctx.lineWidth = 1.5;
    ctx.save(); ctx.beginPath(); ctx.rect(-hw, -hh, o.w, o.h); ctx.clip();
    ctx.beginPath();
    for (let x = -hw - o.h; x < hw; x += 26) { ctx.moveTo(x, hh); ctx.lineTo(x + o.h, -hh); }
    ctx.stroke(); ctx.restore();
  } else if (o.t === "glue") {
    ctx.fillStyle = "#2a3a08"; ctx.fillRect(-hw, -hh, o.w, o.h);
    ctx.strokeStyle = "#b6e34f"; ctx.lineWidth = 2.5; ctx.shadowColor = "#b6e34f"; ctx.shadowBlur = 12;
    ctx.strokeRect(-hw, -hh, o.w, o.h);
    ctx.shadowBlur = 0; ctx.fillStyle = "#b6e34f";
    const horiz = o.w >= o.h, len = horiz ? o.w : o.h, th = (horiz ? o.h : o.w) / 2;
    for (let a = -len / 2 + 10; a < len / 2 - 4; a += 16) { // little drips on both faces

      ctx.beginPath();
      if (horiz) { ctx.arc(a, th + r * 0.6, r, 0, Math.PI * 2); ctx.arc(a + 8, -th - r * 0.6, r * 0.8, 0, Math.PI * 2); }

    ctx.strokeRect(-hw, -hh, o.w, o.h);
    ctx.beginPath();

    ctx.stroke();
  }
  ctx.restore();
}

function drawBall(now) {
  ctx.save(); ctx.translate(ball.x, ball.y);
  const sk = skinNow();
  ctx.shadowColor = sk.glow; ctx.shadowBlur = 20;
  ctx.fillStyle = sk.fill; ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.rotate(ball.spin - angle);
  ctx.strokeStyle = sk.stripe; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-BALL_R * 0.6, 0); ctx.lineTo(BALL_R * 0.6, 0); ctx.stroke();
  if (state === "play" && freeze > 0) {
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, BALL_R + 6 + freeze * 30, 0, Math.PI * 2); ctx.stroke();
  } else if (state === "play" && waiting) {
    const p = (now / 900) % 1; // expanding "ping" ring while the ball waits
    ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - p)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, BALL_R + 4 + p * 22, 0, Math.PI * 2); ctx.stroke();

// ---------- Input ----------
// first tap / click / key after a level loads releases the ball (a tap during "Ready…" queues it)
function launch() {
  if (state !== "play" || !waiting || isShown("menu") || isShown("win")) return false;
  waiting = false;
  return true;
}

const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
window.addEventListener("keydown", e => {
  if (["Space", "Enter", "KeyQ", "KeyE"].includes(e.code) || KEYMAP[e.code]) {
    if (launch() && (e.code === "Space" || e.code === "Enter")) { e.preventDefault(); return; }
  }
  if (KEYMAP[e.code]) {
    keys[KEYMAP[e.code]] = true;
    if (snapMode && !e.repeat && state === "play") { targetAngle += (KEYMAP[e.code] === "right" ? 1 : -1) * Math.PI / 2; Sfx.snap(); }
    e.preventDefault();
  }
  if (e.code === "KeyQ" && state === "play") { snapTo(-1); }
  if (e.code === "KeyE" && state === "play") { snapTo(1); }
  if (e.code === "KeyR") restart();
  if (e.code === "KeyM") toggleMode();
  if ((e.code === "Enter" || e.code === "Space") && isShown("win")) next();
});
window.addEventListener("keyup", e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });

function snapTo(dir) {
  // in smooth mode Q/E still work: jump the target to the next quarter turn
  if (!snapMode) { targetAngle = angle; }
  const q = Math.PI / 2;
  targetAngle = (dir > 0 ? Math.floor(targetAngle / q + 1e-6) + 1 : Math.ceil(targetAngle / q - 1e-6) - 1) * q;
  if (!snapMode) animateSnap();
  Sfx.snap();
}
let snapAnim = null;
function animateSnap() {
  cancelAnimationFrame(snapAnim);
  const step = () => {
    const d = targetAngle - angle;
    if (Math.abs(d) < 0.002 || state !== "play") { if (state === "play") angle = targetAngle; return; }
    angle += d * 0.2; snapAnim = requestAnimationFrame(step);
  };
  step();
}

let drag = null;
cv.addEventListener("pointerdown", e => {
  launch();
  drag = { x: e.clientX, y: e.clientY };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const px = drag.x, py = drag.y, nx = e.clientX, ny = e.clientY;
  drag.x = nx; drag.y = ny;
  if (snapMode || state !== "play") return;
  // dial: the world turns with the finger around the screen centre, so circling spins it all the way round.
  // turn = (finger offset × finger movement) / distance², the exact change in the finger's angle around
  // the centre. Near the centre the distance is clamped to DIAL_MIN_R: slower there, but the direction
  // always follows the finger (v0.9 blended in a left/right drag here, which fought circles in the top half).
  const rx = px - W / 2, ry = py - H / 2;
  const r2 = Math.max(rx * rx + ry * ry, DIAL_MIN_R * DIAL_MIN_R);
  angle += (rx * (ny - py) - ry * (nx - px)) / r2;
});
cv.addEventListener("pointerup", () => { drag = null; });
cv.addEventListener("pointercancel", () => drag = null);

function toggleMode() {
  snapMode = !snapMode;
  targetAngle = Math.round(angle / (Math.PI / 2)) * (Math.PI / 2);
  angVel = 0;
  document.getElementById("snapBtns").classList.toggle("show", snapMode);
  document.body.classList.toggle("snap", snapMode);
  const hint = document.getElementById("hint");
  hint.textContent = snapMode ? "90° mode: tap ⟲ ⟳ (or ← →) to turn a quarter." : "Smooth mode: drag or circle your finger (or hold ← →).";
  hint.style.opacity = 0.85;
}

});

// ---------- Share a result ----------
// text + a link that opens this exact level (?level=N), for WhatsApp / Discord / anywhere
function shareText(w) {
  const link = location.origin + location.pathname + "?level=" + w.n;
  if (w.daily) return `World Shifter Daily ${w.daily} · Level ${w.n} “${w.name}” · ${w.t.toFixed(2)}s · ☠ ${w.deaths}\nBeat my time: ${link}`;
  return `World Shifter · Level ${w.n} “${w.name}” · ${"★".repeat(w.st)}${"☆".repeat(3 - w.st)} in ${w.t.toFixed(2)}s · ☠ ${w.deaths}` +
    (w.gem === true ? " · ◆ gem" : "") + `\nCan you beat it? ${link}`;
}
document.getElementById("bShare").onclick = async () => {
  if (!lastWin) return;
  const text = shareText(lastWin), btn = document.getElementById("bShare");
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text); btn.textContent = "Copied ✓";
  } catch (e) {
    if (e && e.name === "AbortError") return; // closed the share sheet
    window.prompt("Copy and send:", text);
  }
};

document.getElementById("bCard").onclick = () => { hide("card"); if (state === "paused") state = "play"; };

document.getElementById("bBackWorlds").onclick = () => { menuPage = null; buildMenu(); };
document.getElementById("bGift").onclick = openGift;
document.getElementById("bGiftClaim").onclick = () => { claimGift(1); hide("gift"); buildMenu(); };
document.getElementById("bGiftDouble").onclick = async () => { if (await Platform.rewarded()) { claimGift(2); hide("gift"); buildMenu(); } };
document.getElementById("bShop").onclick = openShop;
document.getElementById("bShopClose").onclick = () => { hide("shop"); buildMenu(); };

// ---------- Rewarded help: a stuck player can watch an ad for the landing guide, or to skip the level ----------
// paid with a rewarded ad where ads exist, otherwise with ◆ (the ad-free web version)
function offerKind() {
  if (!level || !deaths || dailyRun) return null;
  let k = null;
  if (deaths.n >= ADS.skipOfferDeaths && levelIdx < LEVELS.length - 1 && !beaten(levelIdx)) k = "skip";
  else if (deaths.n >= ADS.guideOfferDeaths && !guideOn()) k = "guide";
  if (!k) return null;
  const cost = k === "skip" ? ECON.skipCost : ECON.guideCost;
  if (Platform.canReward) return { k, via: "ad", cost };
  return econ.wallet >= cost ? { k, via: "gems", cost } : null;
}
function paintOffer() {
  const o = offerKind(), box = document.getElementById("offer");
  box.classList.toggle("show", !!o);
  if (o) document.getElementById("bOffer").textContent = (o.k === "skip" ? "⏭ Skip this level" : "💡 Landing guide") + (o.via === "ad" ? " · watch an ad" : ` · ${o.cost} ◆`);
}
document.getElementById("bOffer").onclick = async () => {
  const o = offerKind(); if (!o) return;
  const was = state; state = "paused";
  Platform.event("reward_offer_taken", { kind: o.k, via: o.via, level: levelIdx + 1, deaths: deaths.n });
  let ok = false;
  if (o.via === "ad") ok = await Platform.rewarded();
  else if (econ.wallet >= o.cost) { econ.wallet -= o.cost; saveEcon(); ok = true; }
  state = was === "dead" ? "play" : was;
  if (!ok) { paintOffer(); return; }
  if (o.k === "guide") { guideBoost[level.name] = true; paintOffer(); }
  else { econ.skipped[level.name] = true; saveEcon(); goNext(); } // skipped: no stars, it stays open to beat later
};

// ---------- Daily challenge: one level a day, the same for everyone ----------
const today = () => new Date().toISOString().slice(0, 10);
function dailyIndex(d = today()) {
  let h = 2166136261; for (const ch of d) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const lo = Math.min(80, LEVELS.length - 1), hi = Math.max(lo + 1, Math.min(LEVELS.length - 60, 420)); // mid-game difficulty
  return lo + h % (hi - lo);
}
let daily = {};
try { daily = JSON.parse(localStorage.getItem("ws_daily") || "{}"); } catch (e) { daily = {}; }
function paintDaily() {
  const b = document.getElementById("bDaily"), best = daily[today()];
  b.textContent = best ? `📅 Daily challenge · done ✓ ${best.toFixed(2)}s` : `📅 Daily challenge · level ${dailyIndex() + 1}`;
}
document.getElementById("bDaily").onclick = () => { dailyNext = true; loadLevel(dailyIndex()); };

// ---------- Ending: after level 500 ----------
function showEnding() {
  const stars = LEVELS.reduce((a, l) => a + (progress[l.name] || 0), 0);
  const gemTotal = LEVELS.filter(l => l.objs.some(o => o.t === "gem")).length, gemsGot = LEVELS.filter(l => gems[l.name]).length;
  const totals = Object.values(stats).reduce((a, st) => ({ deaths: a.deaths + st.deaths, time: a.time + st.time }), { deaths: 0, time: 0 });
  document.getElementById("endStars").textContent = `★ ${stars} / ${LEVELS.length * 3}`;
  document.getElementById("endInfo").textContent = `◆ ${gemsGot} / ${gemTotal} gems · ☠ ${totals.deaths} deaths · ${Math.round(totals.time / 60)} minutes of turning`;
  show("ending");
}
document.getElementById("bEndMenu").onclick = () => { hide("ending"); buildMenu(); show("menu"); };
document.getElementById("bEndShare").onclick = async () => {
  const stars = LEVELS.reduce((a, l) => a + (progress[l.name] || 0), 0);
  const text = `I finished all ${LEVELS.length} levels of World Shifter · ★ ${stars} / ${LEVELS.length * 3}\n${location.origin + location.pathname}`;
  try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); document.getElementById("bEndShare").textContent = "Copied ✓"; } }
  catch (e) { if (!e || e.name !== "AbortError") window.prompt("Copy and send:", text); }
};

// ---------- Stats screen ----------
function statsRows() {
  const rows = [];
  LEVELS.forEach((l, i) => {
    const st = stats[l.name];
    if (!st || !st.tries) return;
    rows.push({ n: i + 1, name: l.name, ...st, avg: st.time / st.tries, winPct: st.wins / st.tries });
  });
  return rows;
}
function openStats() {
  const rows = statsRows();
  const total = rows.reduce((a, r) => a + r.time, 0), beaten = rows.filter(r => r.wins).length;
  const furthest = rows.length ? Math.max(...rows.map(r => r.n)) : 0;
  document.getElementById("statsSummary").textContent = rows.length
    ? `${Math.round(total / 60)} min played · ${beaten} levels beaten · furthest level ${furthest} · red rows: hardest (lowest win rate, 3+ tries)`
    : "No data yet: play a few levels first.";
  const hard = rows.filter(r => r.tries >= 3).sort((a, b) => a.winPct - b.winPct).slice(0, 5).map(r => r.n);
  document.getElementById("statsTable").innerHTML =
    "<tr><th>#</th><th>Level</th><th>Tries</th><th>Wins</th><th>Win %</th><th>1st win on try</th><th>Spikes</th><th>Void</th><th>Resets</th><th>Gave up</th><th>Best</th><th>Avg try</th></tr>" +
    rows.map(r => `<tr class="${hard.includes(r.n) ? "hot" : ""}"><td>${r.n}</td><td>${r.name}</td><td>${r.tries}</td><td>${r.wins}</td><td>${Math.round(r.winPct * 100)}%</td>` +
      `<td>${r.firstWin || "–"}</td><td>${r.spikes}</td><td>${r.voids}</td><td>${r.resets}</td><td>${r.gaveUp}</td><td>${r.best !== null ? r.best + "s" : "–"}</td><td>${r.avg.toFixed(1)}s</td></tr>`).join("");
  document.getElementById("chkDeaths").checked = showDeaths;
  document.getElementById("statsText").style.display = "none";
  show("statsPanel");
}
function statsTSV() {
  const head = ["level", "name", "tries", "wins", "win_pct", "first_win_try", "spike_deaths", "void_deaths", "resets", "gave_up", "best_s", "avg_try_s"];
  const lines = statsRows().map(r => [r.n, r.name, r.tries, r.wins, Math.round(r.winPct * 100), r.firstWin, r.spikes, r.voids, r.resets, r.gaveUp, r.best ?? "", r.avg.toFixed(1)].join("\t"));
  return `World Shifter ${document.getElementById("ver").textContent} · ${new Date().toISOString().slice(0, 10)} · screen ${W}x${H}\n` + [head.join("\t"), ...lines].join("\n");
}
// everything the designer needs: the table, plus death spots and best-run paths (6 samples/s)
function fullExport() {
  const ghostsLite = {};
  for (const name in ghosts) {
    const g = ghosts[name], step = Math.max(1, Math.round(GHOST_HZ / 6)), pts = [];
    for (let k = 0; k < g.p.length / 2; k += step) pts.push(g.p[2 * k], g.p[2 * k + 1]);
    ghostsLite[name] = { t: Math.round(g.t * 100) / 100, hz: GHOST_HZ / step, p: pts };
  }
  return statsTSV() + "\n---WSDATA---\n" + JSON.stringify({ v: document.getElementById("ver").textContent, order: LEVELS.map(l => l.name), stats, ghosts: ghostsLite, stars: progress, gems, econ, errors: Platform.errors, platform: Platform.env });
}
document.getElementById("bSaveStats").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([fullExport()], { type: "text/plain" }));
  a.download = `world-shifter-playtest-${new Date().toISOString().slice(0, 10)}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("bCopyStats").onclick = () => {
  const txt = fullExport(), ta = document.getElementById("statsText"), btn = document.getElementById("bCopyStats");
  ta.value = txt; ta.style.display = "block";
  const done = () => { btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy", 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => ta.select());
  else { ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} }
};
document.getElementById("bResetStats").onclick = () => {
  if (!confirm("Delete all playtest stats on this device?")) return;
  stats = {}; saveStats(); openStats();
};
document.getElementById("bCloseStats").onclick = () => hide("statsPanel");
document.getElementById("chkDeaths").onchange = e => {
  showDeaths = e.target.checked;
  try { localStorage.setItem("ws_showdeaths", showDeaths ? "1" : "0"); } catch (err) {}
};
let verTaps = [];
document.getElementById("ver").addEventListener("click", () => {
  const now = performance.now();
  verTaps = verTaps.filter(t => now - t < 2000); verTaps.push(now);
  if (verTaps.length >= 5) { verTaps = []; openStats(); }
});
window.addEventListener("pagehide", () => { if (level) leaveRun(false); });

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  watchFrameRate(now - last);
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (level) update(dt);
  render(now);
  requestAnimationFrame(frame);
}
buildMenu();
const linkLevel = parseInt(new URLSearchParams(location.search).get("level"), 10);
Platform.init();
if (!Platform.sharing) for (const id of ["bShare", "bEndShare"]) document.getElementById(id).style.display = "none";
if (linkLevel >= 1 && linkLevel <= LEVELS.length) loadLevel(linkLevel - 1); // shared link: straight in
else if (Platform.env === "crazygames") loadLevel(nextUnbeaten()); // portals require landing in gameplay
else { loadLevel(Math.max(0, nextPlayable())); show("menu"); state = "paused"; menuPage = null; buildMenu(); if (giftReady()) openGift(); }
if (/[?&]stats\b/.test(location.search)) openStats();
requestAnimationFrame(frame);
</script>
</body>
